
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Method — Sunlight Test</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #17100b;
}

/* FULL SCREEN IMAGE */

.hero {
  position: relative;
  height: 100svh;
  min-height: 500px;
  overflow: hidden;
  isolation: isolate;
  background: #17100b;
}

.hero-image {
  position: absolute;
  inset: -100px 0;
  z-index: 0;

  background-image:
    url("./Sunrise%20Meditation%20on%20a%20Wooden%20Deck.png");

  background-size: cover;
  background-position: center;

  transform:
    translate3d(0, var(--shift, 0px), 0)
    scale(1.04);

  will-change: transform;
}

/* LIGHT LAYERS */

.sunlight {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* SUN GLOW */

.sun-glow {
  position: absolute;

  width: 70vw;
  height: 75vh;

  left: 62%;
  top: -22%;

  border-radius: 50%;

  background: radial-gradient(
    ellipse,
    rgba(255, 242, 175, 0.55) 0%,
    rgba(255, 195, 90, 0.28) 28%,
    rgba(255, 155, 55, 0.10) 50%,
    transparent 75%
  );

  filter: blur(35px);

  animation: glowPulse 5s ease-in-out infinite alternate;
}

/* ANIMATED SUN RAYS */

.sun-rays {
  position: absolute;
  inset: -35% -30%;

  background: repeating-conic-gradient(
    from 160deg at 62% 18%,
    transparent 0deg 8deg,
    rgba(255, 225, 155, 0.23) 10deg,
    rgba(255, 245, 195, 0.36) 13deg,
    transparent 17deg 27deg
  );

  mask-image: radial-gradient(
    ellipse at 62% 18%,
    black 5%,
    rgba(0,0,0,.75) 35%,
    transparent 78%
  );

  filter: blur(13px);

  transform-origin: 62% 18%;

  animation: raysMove 10s ease-in-out infinite alternate;
}

/* ATMOSPHERIC HAZE */

.sun-haze {
  position: absolute;
  inset: 0;

  background: radial-gradient(
    ellipse at 62% 20%,
    rgba(255, 205, 115, 0.23),
    transparent 62%
  );

  animation: hazePulse 7s ease-in-out infinite alternate;
}

/* ANIMATIONS */

@keyframes glowPulse {
  0% {
    opacity: 0.45;
    transform: scale(0.92);
  }

  100% {
    opacity: 1;
    transform: scale(1.12);
  }
}

@keyframes raysMove {
  0% {
    opacity: 0.35;
    transform: rotate(-3deg) scale(0.97);
  }

  100% {
    opacity: 0.95;
    transform: rotate(3deg) scale(1.06);
  }
}

@keyframes hazePulse {
  0% {
    opacity: 0.35;
  }

  100% {
    opacity: 0.95;
  }
}

/* SCROLL TEST AREA */

.scroll-space {
  height: 100vh;
  background: #17100b;
}

/* MOBILE */

@media (max-width: 767px) {
  .hero-image {
    background-position: 55% center;
  }

  .sun-glow {
    width: 120vw;
    left: 30%;
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  .sun-glow,
  .sun-rays,
  .sun-haze {
    animation: none;
  }

  .hero-image {
    will-change: auto;
  }
}
  
/* 3D CINEMATIC IMAGE EFFECT */

.hero {
  perspective: 1100px;
  transform-style: preserve-3d;
}

.hero-image {
  inset: -130px;
  transform-origin: center;
  transform:
    translate3d(
      var(--move-x, 0px),
      calc(var(--shift, 0px) + var(--move-y, 0px)),
      0
    )
    rotateX(var(--rotate-x, 0deg))
    rotateY(var(--rotate-y, 0deg))
    scale(1.12);

  transition: transform 0.18s ease-out;
}

@media (max-width: 767px),
       (prefers-reduced-motion: reduce) {
  .hero-image {
    transform:
      translate3d(0, var(--shift, 0px), 0)
      scale(1.12);
  }
}

</style>
</head>

<body>

<section class="hero" id="hero">

  <div class="hero-image"></div>

  <div class="sunlight" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="sun-rays"></div>
    <div class="sun-haze"></div>
  </div>

</section>

<!-- Empty area to test scrolling -->
<div class="scroll-space"></div>

<script>
(function () {

  const hero = document.getElementById("hero");

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  let ticking = false;

  function update() {
    ticking = false;

    if (reducedMotion.matches) {
      hero.style.setProperty("--shift", "0px");
      return;
    }

    const rect = hero.getBoundingClientRect();

    if (rect.bottom < 0 || rect.top > innerHeight) {
      return;
    }

    const shift = Math.max(
      -70,
      Math.min(70, -rect.top * 0.15)
    );

    hero.style.setProperty(
      "--shift",
      shift.toFixed(1) + "px"
    );
  }

  function requestUpdate() {
    if (ticking) return;

    ticking = true;
    requestAnimationFrame(update);
  }

  addEventListener("scroll", requestUpdate, {
    passive: true
  });

  addEventListener("resize", requestUpdate);

  update();

})();
</script>

<script>
(function () {
  const hero = document.querySelector(".hero");
  if (!hero) return;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  const finePointer = window.matchMedia(
    "(hover: hover) and (pointer: fine)"
  );

  function moveImage(event) {
    if (reducedMotion.matches || !finePointer.matches) {
      return;
    }

    const rect = hero.getBoundingClientRect();

    const x = (
      (event.clientX - rect.left) / rect.width - 0.5
    ) * 2;

    const y = (
      (event.clientY - rect.top) / rect.height - 0.5
    ) * 2;

    hero.style.setProperty(
      "--rotate-y",
      (x * 3).toFixed(2) + "deg"
    );

    hero.style.setProperty(
      "--rotate-x",
      (-y * 2).toFixed(2) + "deg"
    );

    hero.style.setProperty(
      "--move-x",
      (x * -14).toFixed(1) + "px"
    );

    hero.style.setProperty(
      "--move-y",
      (y * -10).toFixed(1) + "px"
    );
  }

  function resetImage() {
    hero.style.setProperty("--rotate-x", "0deg");
    hero.style.setProperty("--rotate-y", "0deg");
    hero.style.setProperty("--move-x", "0px");
    hero.style.setProperty("--move-y", "0px");
  }

  hero.addEventListener("pointermove", moveImage);
  hero.addEventListener("pointerleave", resetImage);
  reducedMotion.addEventListener("change", resetImage);
})();
</script>

</body>
</html>
