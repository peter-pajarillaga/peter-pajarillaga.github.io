let warpLast=performance.now();
function advanceWarp(now){
  const dt=Math.min(.05,Math.max(0,(now-warpLast)/1000));warpLast=now;

  for(const layer of starLayers){
    const {positions,attr,stars,material,layerIndex}=layer;
    for(let i=0;i<stars.length;i++){
      let s=stars[i];s.z+=s.speed*dt*boost;
      if(s.z>72){const replacement=newExteriorStar(false);replacement.speed=s.speed;stars[i]=replacement;s=replacement;}
      const k=i*3;positions[k]=s.x;positions[k+1]=s.y;positions[k+2]=s.z;
    }
    attr.needsUpdate=true;
    // Slow, subtle collective scintillation: no distracting blinking dust.
    material.opacity=layer.cfg.opacity*(.95+.05*Math.sin(now*.00038+layerIndex*1.8));
  }
}
// V45: continuous arc-length-parametrized drone trajectory; no per-waypoint easing/stops.
const flightPoints=[[-9,-1,9],[-5,1.2,5.5],[3.6,.8,4.8],[8,3,9],[2,5,16],[0,.75,20.5]];
const lookPoints=[[0,.2,0],[0,.3,0],[0,.2,0],[0,.4,0],[0,.1,1.5],[0,.35,1.4]];
const flightPath=new T.CatmullRomCurve3(flightPoints.map(p=>new T.Vector3(...p)),false,'centripetal');
const flightLook=new T.CatmullRomCurve3(lookPoints.map(p=>new T.Vector3(...p)),false,'centripetal');
const FLIGHT_DURATION=13.5/1.2;
let start=performance.now(),playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,gridOn=true;
if(!playing)start-=FLIGHT_DURATION*1000;
const status=document.querySelector('#status');
// V44: damped pointer-driven spatial parallax, enabled only after drone arrival.
const pointerTarget=new T.Vector2(),pointerSmooth=new T.Vector2();
const finePointer=matchMedia('(hover: hover) and (pointer: fine)').matches;
if(finePointer){
  root.addEventListener('pointermove',e=>{
    const r=root.getBoundingClientRect();
    pointerTarget.set(T.MathUtils.clamp(((e.clientX-r.left)/r.width-.5)*2,-1,1),T.MathUtils.clamp(((e.clientY-r.top)/r.height-.5)*2,-1,1));
  },{passive:true});
  root.addEventListener('pointerleave',()=>pointerTarget.set(0,0));
  addEventListener('blur',()=>pointerTarget.set(0,0));
}
function applySpatialParallax(){
  pointerSmooth.lerp(pointerTarget,.045);
  // Small sideways and vertical camera travel reveals genuine 3D depth.
  camera.position.x+=pointerSmooth.x*.78;
  camera.position.y-=pointerSmooth.y*.42;
  camera.lookAt(pointerSmooth.x*.16,.35-pointerSmooth.y*.12,1.4);
}
function camAt(t){
  const u=T.MathUtils.clamp(t/FLIGHT_DURATION,0,1);
  camera.position.copy(flightPath.getPointAt(u));
  camera.lookAt(flightLook.getPoint(u));
}
document.querySelector('#replay').onclick=()=>{start=performance.now();playing=true};
document.querySelector('#skip').onclick=()=>{playing=false;camAt(FLIGHT_DURATION);status.textContent='INTERIOR VIEW · INWARD-FACING CRYSTAL PANELS'};
document.querySelector('#lights').onclick=()=>{gridOn=!gridOn;gridGroup.visible=gridOn;document.querySelector('#lights').textContent='RUBY GRID: '+(gridOn?'ON':'OFF')};
function animate(now){requestAnimationFrame(animate);advanceWarp(now);const t=(now-start)/1000;
if(playing){camAt(Math.min(t,FLIGHT_DURATION));status.textContent=t<FLIGHT_DURATION?'DRONE FLIGHT · '+Math.round(Math.min(t/FLIGHT_DURATION,1)*100)+'%':'INTERIOR VIEW · INWARD-FACING CRYSTAL PANELS';if(t>=FLIGHT_DURATION)playing=false}
else{camAt(FLIGHT_DURATION);if(finePointer)applySpatialParallax()}
opticPulses.forEach(({pulse,curve,offset})=>{
  const phase=(now*.000065+offset)%1;
  pulse.position.copy(curve.getPoint(phase));
  pulse.material.opacity=.35+.45*Math.sin(Math.PI*phase);
});
core.rotation.y+=.0035;jewel.rotation.y-=.0035;jewel.rotation.x+=.0012;outer.rotation.y-=.001;coreHalo.rotation.z+=.002;const seconds=now*.001;
  const pulse=1+.12*Math.sin(now*.0025);redLight.intensity=95*pulse;coreLamp.intensity=15*pulse;panels.forEach((p,i)=>{p.glow.intensity=2.4+.65*Math.sin(now*.0018+i)});renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?55:40;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});if(innerWidth<700){camera.fov=55;camera.updateProjectionMatrix()}requestAnimationFrame(animate);
})();
</script></body></html>
