
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nature Method | Cinematic Sunlight</title>

<style>
/* =========================================
   NATURE METHOD — CINEMATIC SUNLIGHT TEST
========================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #17100b;
}

/* ORIGINAL PHOTOGRAPH */

.hero {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 500px;
  overflow: hidden;
  isolation: isolate;
  background: #17100b;
}

.hero-image {
  position: absolute;
  inset: 0;
  z-index: 0;

  background-image: url(
    "./Sunrise%20Meditation%20on%20a%20Wooden%20Deck.png"
  );

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* =========================================
   SUNLIGHT OVERLAY
========================================= */

.sunlight {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* SUN GLOW */

.sun-glow {
  position: absolute;
  width: 85vw;
  height: 90vh;
  left: 45%;
  top: -34%;

  border-radius: 50%;

  background: radial-gradient(
    ellipse,
    rgba(255, 246, 191, .50) 0%,
    rgba(255, 214, 117, .28) 22%,
    rgba(255, 173, 70, .12) 47%,
    transparent 72%
  );

  filter: blur(32px);

  animation: glowPulse
    5s ease-in-out infinite alternate;
}

/* MOVING GOLDEN SUNBEAMS */

.sun-rays {
  position: absolute;
  inset: -35%;

  background: repeating-conic-gradient(
    from 152deg at 62% 20%,
    transparent 0deg 7deg,
    rgba(255, 225, 150, .05) 8deg,
    rgba(255, 235, 175, .42) 11deg,
    rgba(255, 246, 207, .60) 13deg,
    rgba(255, 225, 150, .08) 16deg,
    transparent 21deg 29deg
  );

  -webkit-mask-image: radial-gradient(
    ellipse at 62% 20%,
    black 0%,
    rgba(0,0,0,.95) 25%,
    rgba(0,0,0,.50) 53%,
    transparent 78%
  );

  mask-image: radial-gradient(
    ellipse at 62% 20%,
    black 0%,
    rgba(0,0,0,.95) 25%,
    rgba(0,0,0,.50) 53%,
    transparent 78%
  );

  filter: blur(8px);

  transform-origin: 62% 20%;

  animation: sunbeamSweep
    7s ease-in-out infinite alternate;
}

/* SECOND LIGHT BEAM LAYER */

.sun-rays-secondary {
  position: absolute;
  inset: -35%;

  background: repeating-conic-gradient(
    from 165deg at 62% 20%,
    transparent 0deg 16deg,
    rgba(255, 233, 174, .30) 19deg,
    rgba(255, 248, 211, .46) 21deg,
    transparent 25deg 39deg
  );

  -webkit-mask-image: radial-gradient(
    ellipse at 62% 20%,
    black 0%,
    rgba(0,0,0,.70) 38%,
    transparent 76%
  );

  mask-image: radial-gradient(
    ellipse at 62% 20%,
    black 0%,
    rgba(0,0,0,.70) 38%,
    transparent 76%
  );

  filter: blur(16px);
  transform-origin: 62% 20%;

  animation: secondarySweep
    11s ease-in-out infinite alternate;
}

/* WARM ATMOSPHERE */

.sun-haze {
  position: absolute;
  inset: 0;

  background: radial-gradient(
    ellipse at 62% 22%,
    rgba(255, 209, 115, .20),
    transparent 67%
  );

  animation: hazePulse
    6s ease-in-out infinite alternate;
}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes glowPulse {
  0% {
    opacity: .50;
    transform: scale(.92);
  }

  100% {
    opacity: 1;
    transform: scale(1.13);
  }
}

@keyframes sunbeamSweep {
  0% {
    opacity: .32;
    transform: rotate(-8deg) scale(.96);
  }

  50% {
    opacity: .95;
  }

  100% {
    opacity: .85;
    transform: rotate(8deg) scale(1.08);
  }
}

@keyframes secondarySweep {
  0% {
    opacity: .25;
    transform: rotate(6deg) scale(1.02);
  }

  100% {
    opacity: .75;
    transform: rotate(-6deg) scale(1.1);
  }
}

@keyframes hazePulse {
  from {
    opacity: .35;
  }

  to {
    opacity: 1;
  }
}

/* =========================================
   SCROLL TEST AREA
========================================= */

.scroll-space {
  height: 100vh;
  background: #17100b;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 767px) {
  .hero-image {
    background-position: 55% center;
  }

  .sun-glow {
    width: 140vw;
    left: 22%;
  }

  .sun-rays,
  .sun-rays-secondary {
    transform-origin: 62% 20%;
  }
}

/* =========================================
   ACCESSIBILITY
========================================= */

@media (prefers-reduced-motion: reduce) {
  .sun-glow,
  .sun-rays,
  .sun-rays-secondary,
  .sun-haze {
    animation: none;
  }
}
</style>
</head>

<body>

<section class="hero" id="hero">

  <!-- ORIGINAL IMAGE -->
  <div class="hero-image"></div>

  <!-- ANIMATED SUNLIGHT -->
  <div class="sunlight" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="sun-rays"></div>
    <div class="sun-rays-secondary"></div>
    <div class="sun-haze"></div>
  </div>

</section>

<!-- SCROLL TEST AREA -->
<div class="scroll-space"></div>

</body>
</html>
