const $=id=>document.getElementById(id);let active=[],timers=[],particleFrame=0,paused=false,rate=1,particles=[];const C=$('fx'),ctx=C.getContext('2d');function resize(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function anim(el,frames,options){let a=el.animate(frames,{fill:'forwards',easing:'linear',...options,duration:options.duration/rate});active.push(a);return a}function later(fn,ms){const t=setTimeout(fn,ms/rate);timers.push(t)}function spark(){let x=innerWidth/2,y=innerHeight*.46;for(let i=0;i<80;i++){let angle=Math.random()*Math.PI*2,v=2+Math.random()*12;particles.push({x,y,vx:Math.cos(angle)*v,vy:Math.sin(angle)*v-2,life:30+Math.random()*32,max:62,size:.5+Math.random()*2.7,red:Math.random()>.34})}}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.978;p.vy=p.vy*.98+.13;p.life--;ctx.globalAlpha=Math.max(0,p.life/55);ctx.fillStyle=p.red?'#ff3929':'#fff1c4';ctx.shadowBlur=12;ctx.shadowColor=p.red?'#f00':'#fff';ctx.fillRect(p.x,p.y,p.size*2,p.size*.8);if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;ctx.shadowBlur=0;particleFrame=requestAnimationFrame(draw)}draw();function reset(){timers.forEach(clearTimeout);timers=[];active.forEach(a=>a.cancel());active=[];particles=[];document.body.classList.remove('shake');['ring','speed','word','base','originalLogo','afterA','afterB','logo','header','caption','streak','shock','flash',...Array.from({length:5},(_,i)=>'neon'+i)].forEach(id=>$(id).removeAttribute('style'));paused=false;$('pause') && ($('pause').textContent='PAUSE')}function play(){reset();rate=Number($('speedCtl').value);const mobile=innerWidth<640,initial=mobile?1.45:2.55;const center=$('logo');center.style.transform=`translate(-50%,-50%) scale(${initial})`;$('word').style.opacity='0';$('base').style.opacity='0';$('originalLogo').style.opacity='0';$('header').style.opacity='0';$('caption').style.opacity='0';$('afterA').style.opacity='0';$('afterB').style.opacity='0';for(let i=0;i<5;i++){$('neon'+i).classList.remove('lit');$('neon'+i).style.opacity='0'}
// The ring is the actual checkered artwork isolated from the uploaded PNG.
for(const id of ['ring'])anim($(id),[{transform:'rotate(0deg)'},{transform:'rotate(650deg)',offset:.67},{transform:'rotate(720deg)'}],{duration:2180,easing:'cubic-bezier(.12,.55,.15,1)'});
// The speedometer is a separate pixel layer from the same original image.
anim($('speed'),[{transform:'rotate(-5deg)'},{transform:'rotate(6deg)',offset:.12},{transform:'rotate(-7deg)',offset:.24},{transform:'rotate(7deg)',offset:.38},{transform:'rotate(-4deg)',offset:.52},{transform:'rotate(3deg)',offset:.7},{transform:'rotate(0deg)'}],{duration:2200,easing:'ease-in-out'});
anim(center,[{filter:'drop-shadow(0 0 4px #e9000055)',offset:0},{filter:'drop-shadow(0 0 26px #ff1313b0)',offset:.7},{filter:'drop-shadow(0 0 8px #e9000044)',offset:1}],{duration:2800});
later(()=>{anim($('streak'),[{left:'-110vw',opacity:0},{left:'-45vw',opacity:.9,offset:.45},{left:'25vw',opacity:0}],{duration:530,easing:'ease-out'});for(let [id,delay,opacity] of [['afterB',0,.42],['afterA',55,.65],['word',115,1]])later(()=>{let e=$(id);e.style.opacity='1';anim(e,[{transform:'translateX(-140vw) skewX(-15deg)',opacity:0,filter:'blur(14px) drop-shadow(-40px 0 10px #f00)'},{transform:'translateX(18px) skewX(3deg)',opacity,filter:'blur(2px) drop-shadow(-22px 0 10px #f00)',offset:.78},{transform:'translateX(0) skewX(0)',opacity,filter:'blur(0px) drop-shadow(-5px 0 2px #f00)'}],{duration:480,easing:'cubic-bezier(.13,.72,.24,1)'})},delay)},880);
later(()=>{for(let i=0;i<5;i++){later(()=>{const e=$('neon'+i);e.classList.add('lit');anim(e,[{opacity:0,filter:'brightness(.15)'},{opacity:.25,filter:'brightness(3)',offset:.15},{opacity:.05,filter:'brightness(.4)',offset:.30},{opacity:1,filter:'brightness(1.8) drop-shadow(0 0 6px #eef8ff)',offset:.65},{opacity:1,filter:'brightness(1)'}],{duration:330,easing:'ease-out'});},i*125)}} ,1540);
later(()=>{spark();document.body.classList.add('shake');later(()=>document.body.classList.remove('shake'),200);anim($('flash'),[{opacity:0},{opacity:.95,offset:.18},{opacity:0}],{duration:470});anim($('shock'),[{transform:'translate(-50%,-50%) scale(.3)',opacity:.9},{transform:'translate(-50%,-50%) scale(6)',opacity:0}],{duration:550,easing:'ease-out'});anim($('base'),[{opacity:0},{opacity:1}],{duration:250});anim($('afterA'),[{opacity:.7},{opacity:0}],{duration:360});anim($('afterB'),[{opacity:.4},{opacity:0}],{duration:450})},1510);
// Keep the fully reconstructed ring visible until assembly is complete.
// Then perform a very quick, synchronized swap to the ACTUAL uploaded logo,
// while the logo is still centered and stationary. Only afterward does it fly.
later(()=>{
  const original=$('originalLogo');
  original.style.opacity='0';
  anim(original,[{opacity:0},{opacity:1}],{duration:85,easing:'ease-in-out'});
  for(const id of ['ring','speed','word','base','afterA','afterB','neon0','neon1','neon2','neon3','neon4']){
    anim($(id),[{opacity:1},{opacity:0}],{duration:85,easing:'ease-in-out'});
  }
},2230);
later(()=>{parent.postMessage({type:'fastlane-flight-start'},'*');},2365);
} window.addEventListener('message', e => { if(e.data?.type==='fastlane-target') {const t=$('logoTarget');t.style.position='fixed';t.style.left=e.data.x+'px';t.style.top=e.data.y+'px';t.style.width=e.data.w+'px';t.style.height=e.data.h+'px';}});const dummy=document.createElement('select');dummy.id='speedCtl';dummy.innerHTML='<option value="1" selected>1</option>';dummy.hidden=true;document.body.appendChild(dummy);play();setTimeout(()=>parent.postMessage({type:'fastlane-intro-complete'},'*'),3450);
